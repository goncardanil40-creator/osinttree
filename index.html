<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Tree - Дерево инструментов OSINT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        h1 {
            color: white;
            text-align: center;
            font-size: 3em;
            margin-bottom: 10px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            margin: 50px auto;
        }
        .info {
            color: #333;
            line-height: 1.8;
            font-size: 1.1em;
        }
        .button {
            display: inline-block;
            background-color: #667eea;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .button:hover {
            background-color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 OSINT Tree</h1>
        <p class="info">
            Добро пожаловать на проект <strong>OSINT Tree</strong>! 
            Здесь вы найдете полезные инструменты и ресурсы для открытых расследований.
        </p>
        <p class="info">
            OSINT (Open Source Intelligence) - это методология сбора и анализа информации из открытых источников.
        </p>
        <a href="https://github.com/goncardanil40-creator/osinttree" class="button">📂 Перейти на GitHub</a>
    </div>
</body>
</html>
